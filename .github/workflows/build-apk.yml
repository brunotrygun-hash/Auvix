name: Build Auvix APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar plataforma Android
        run: flutter create --platforms=android .

      - name: Configurar assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AUVIX_KEYSTORE_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path

          base64_data = os.environ["KEYSTORE_BASE64"].strip()

          keystore = base64.b64decode(
              base64_data,
              validate=True
          )

          Path("android/auvix-release-key.jks").write_bytes(keystore)

          print("Keystore bytes:", len(keystore))
          print(
              "Keystore SHA256:",
              hashlib.sha256(keystore).hexdigest()
          )
          PY

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=auvix
          storeFile=auvix-release-key.jks
          EOF

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          imports = """import java.io.FileInputStream
          import java.util.Properties

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(
                  FileInputStream(keystorePropertiesFile)
              )
          }

          """

          text = imports + text

          signing_config = """    signingConfigs {
                  create("release") {
                      keyAlias =
                          keystoreProperties["keyAlias"] as String

                      keyPassword =
                          keystoreProperties["keyPassword"] as String

                      storeFile =
                          rootProject.file(
                              keystoreProperties["storeFile"] as String
                          )

                      storePassword =
                          keystoreProperties["storePassword"] as String
                  }
              }

              """

          text = text.replace(
              "    buildTypes {",
              signing_config + "    buildTypes {"
          )

          text = text.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")'
          )

          path.write_text(text)
          PY

      - name: Instalar dependências
        run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: auvix-apk
          path: build/app/outputs/flutter-apk/app-release.apk
