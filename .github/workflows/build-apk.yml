name: Build Auvix APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar plataforma Android
        run: flutter create --platforms=android .

      - name: Configurar e testar assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.AUVIX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AUVIX_KEYSTORE_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path

          base64_data = os.environ["KEYSTORE_BASE64"].strip()

          keystore = base64.b64decode(
              base64_data,
              validate=True
          )

          path = Path("android/auvix-release-key.jks")
          path.write_bytes(keystore)

          print("Keystore bytes:", len(keystore))
          print(
              "Keystore SHA256:",
              hashlib.sha256(keystore).hexdigest()
          )
          PY

          echo "Testando keystore..."

          keytool -list \
            -keystore android/auvix-release-key.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias auvix

          echo "Keystore validado com sucesso."

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=auvix
          storeFile=auvix-release-key.jks
          EOF

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          imports = """import java.io.FileInputStream
          import java.util.Properties

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(
                  FileInputStream(keystorePropertiesFile)
              )
          }

          """

          if not text.startswith("import java.io.FileInputStream"):
              text = imports + text

          signing_config = """    signingConfigs {
                  create("release") {
                      keyAlias =
                          keystoreProperties["keyAlias"] as String

                      keyPassword =
                          keystoreProperties["keyPassword"] as String

                      storeFile =
                          rootProject.file(
                              keystoreProperties["storeFile"] as String
                          )

                      storePassword =
                          keystoreProperties["storePassword"] as String
                  }
              }

              """

          if 'create("release")' not in text:
              text = text.replace(
                  "    buildTypes {",
                  signing_config + "    buildTypes {"
              )

          text = text.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")'
          )

          path.write_text(text)
          PY

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: auvix-apk
          path: build/app/outputs/flutter-apk/app-release.apk
